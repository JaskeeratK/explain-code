<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explain Code Like I'm 5</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f10;
      color: #e2e2e5;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: #6b7280; margin-bottom: 1.5rem; font-size: 0.9rem; }

    .input-section {
      background: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .controls { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }

    select {
      background: #252530;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e2e2e5;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      background: #111115;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      color: #e2e2e5;
      font-family: "Fira Code", "Cascadia Code", monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      padding: 1rem;
      resize: vertical;
      min-height: 160px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #6366f1; }

    button#analyze-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button#analyze-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    button#analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; margin-top: 1.5rem; }

    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid #2a2a30; margin-bottom: 1.25rem; overflow-x: auto; }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.6rem 1rem;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -1px;
    }

    .tab-btn.active { border-bottom-color: #6366f1; color: #a5b4fc; }
    .tab-btn:hover:not(.active) { color: #c4b5fd; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 10px;
      padding: 1.25rem;
    }

    .card p { line-height: 1.7; color: #d1d5db; }

    .step-list { list-style: none; counter-reset: steps; }

    .step-list li {
      counter-increment: steps;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.6rem 0;
      border-bottom: 1px solid #23232a;
      color: #d1d5db;
      line-height: 1.6;
    }

    .step-list li:last-child { border-bottom: none; }

    .step-list li::before {
      content: counter(steps);
      background: #2d2d3d;
      border-radius: 50%;
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .edge-list { list-style: none; }

    .edge-list li {
      background: #1e1e28;
      border-left: 3px solid #f59e0b;
      border-radius: 0 6px 6px 0;
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 0.5rem;
      padding: 0.6rem 0.9rem;
    }

    .complexity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .complexity-card {
      background: #1e1e28;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .complexity-card .label { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .complexity-card .value { font-size: 1.1rem; font-weight: 700; color: #60a5fa; font-family: monospace; }
    .complexity-card .desc { font-size: 0.8rem; color: #9ca3af; margin-top: 0.3rem; }

    #mermaid-container { background: #0d0d1a; border-radius: 8px; padding: 1.5rem; overflow: auto; min-height: 120px; display: flex; justify-content: center; }
    #mermaid-container svg { max-width: 100%; height: auto; }

    .error-box {
      background: #2a1515;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      color: #fca5a5;
      padding: 1rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Explain Code Like I'm 5</h1>
    <p class="subtitle">Paste any code — get plain-English explanation, flowchart, edge cases & complexity</p>

    <div class="input-section">
      <div class="controls">
        <label style="font-size:0.85rem;color:#9ca3af">Level:</label>
        <select id="level">
          <option value="beginner">Beginner (ELI5)</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
        <button id="analyze-btn" onclick="analyze()">
          Analyze Code <span class="spinner" id="spinner"></span>
        </button>

      </div>
      <textarea id="code" placeholder="Paste your code here...
&#10;Example:&#10;int sum(int n) {&#10;    int s = 0;&#10;    for(int i = 1; i &lt;= n; i++) s += i;&#10;    return s;&#10;}"></textarea>
    </div>

    <div id="error-area"></div>

    <div id="results">
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('eli5')">🧒 ELI5</button>
        <button class="tab-btn" onclick="showTab('steps')">📋 Step-by-step</button>
        <button class="tab-btn" onclick="showTab('flow')">🗺 Flowchart</button>
        <button class="tab-btn" onclick="showTab('edges')">⚠️ Edge cases</button>
        <button class="tab-btn" onclick="showTab('complexity')">⏱ Complexity</button>
      </div>

      <div id="tab-eli5" class="tab-panel active">
        <div class="card"><p id="eli5-text"></p>
          <button onclick="speakELI5()" style="margin-top:1rem;background:#1e1b4b;border:1px solid #6366f1;color:#a5b4fc;padding:0.4rem 1rem;border-radius:6px;cursor:pointer;font-size:0.85rem">
            🔊 Read aloud
          </button>
        </div>
      </div>

      <div id="tab-steps" class="tab-panel">
        <div class="card">
          <ul class="step-list" id="steps-list"></ul>
        </div>
      </div>

      <div id="tab-flow" class="tab-panel">
        <div class="card">
          <div id="mermaid-container"><p style="color:#aaa;font-size:0.85rem">Loading diagram…</p></div>
        </div>
      </div>

      <div id="tab-edges" class="tab-panel">
        <div class="card">
          <ul class="edge-list" id="edge-list"></ul>
        </div>
      </div>

      <div id="tab-complexity" class="tab-panel">
        <div class="complexity-grid">
          <div class="complexity-card">
            <div class="label">Time complexity</div>
            <div class="value" id="time-val"></div>
            <div class="desc" id="time-desc"></div>
          </div>
          <div class="complexity-card">
            <div class="label">Space complexity</div>
            <div class="value" id="space-val"></div>
            <div class="desc" id="space-desc"></div>
          </div>
        </div>
      </div>
      <div id="chat-section" style="display:none;margin-top:1.5rem">
        <div style="background:#1a1a1e;border:1px solid #2a2a30;border-radius:10px;padding:1.25rem">
          <h3 style="font-size:0.95rem;color:#a5b4fc;margin-bottom:1rem">💬 Ask about this code</h3>
          <div id="chat-messages" style="min-height:60px;max-height:240px;overflow-y:auto;margin-bottom:0.75rem;display:flex;flex-direction:column;gap:0.5rem"></div>
          <div style="display:flex;gap:0.5rem">
            <input id="chat-input" type="text" placeholder="Why is this slow? How do I optimize it?"
              style="flex:1;background:#111115;border:1px solid #2a2a30;border-radius:6px;color:#e2e2e5;padding:0.5rem 0.75rem;font-size:0.875rem;outline:none"
              onkeydown="if(event.key==='Enter') askQuestion()"/>
            <button onclick="askQuestion()"
              style="background:#6366f1;border:none;border-radius:6px;color:white;padding:0.5rem 1rem;cursor:pointer;font-size:0.875rem">Ask</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
